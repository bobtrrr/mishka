<!DOCTYPE html>
<html class="page" lang="ru">

<head>
  <meta charset="UTF-8">
  <title>Главная страница | Mishka</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles/styles.css">
  <script src="scripts/index.js" defer></script>
</head>

<body class="page__body page__layout">
  <header class="page__header page-header">
    <div class="container">
      <nav class="page-header__main-nav main-nav">
        <div class="main-nav__top">
          <a class="main-nav__logo logo" href="#" aria-label="Логотип Mishka">
            <picture>
              <source media="(min-width: 1110px)" srcset="./images/logo-desktop.svg" width="149" height="72" type="image/svg+xml">
              <source media="(min-width: 728px)" srcset="./images/logo-tablet.svg" width="114" height="46" type="image/svg+xml">
              <img src="./images/logo-mobile.svg" width="86" height="35" alt="">
            </picture>
          </a>

          <button class="main-nav__button toggle-button" type="button" aria-label="Открыть меню">
            <!-- <svg width="21" height="20">
              <use href="./icons/stack.svg#icon-close" />
            </svg> -->
          </button>
        </div>

        <div class="main-nav__bottom">
          <ul class="main-nav__site-nav site-nav">
            <li class="site-nav__item">
              <a class="site-nav__link" href="#">Каталог товаров</a>
            </li>
            <li class="site-nav__item">
              <a class="site-nav__link" href="#">Вязание на заказ</a>
            </li>
          </ul>

          <ul class="main-nav__user-nav user-nav">
            <li class="user-nav__item">
              <a class="user-nav__link user-nav__link--search" href="#">
                <div class="user-nav__icon-container">
                  <svg class="user-nav__icon" width="18" height="18">
                    <use href="./icons/stack.svg#icon-search" />
                  </svg>
                </div>
                <span class="user-nav__caption">Поиск по сайту</span>
              </a>
            </li>
            <li class="user-nav__item">
              <a class="user-nav__link" href="#">
                <div class="user-nav__icon-container">
                  <svg class="user-nav__icon" width="21" height="18">
                    <use href="./icons/stack.svg#icon-cart" />
                  </svg>
                </div>
                <span class="user-nav__caption">Корзина: <span class="user-nav__cart-count">пока пуста</span></span>
              </a>
            </li>
          </ul>

          <ul class="main-nav__category-nav category-nav">
            <li class="category-nav__item">
              <a class="category-nav__link" href="#">Новые поступления</a>
            </li>
            <li class="category-nav__item">
              <a class="category-nav__link" href="#">Распродажа</a>
            </li>
          </ul>

          <p class="main-nav__delivery">Бесплатная доставка по России</p>
        </div>
      </nav>
    </div>
  </header>

  <div class="page__content-wrapper">
    <main class="page__content">
      <section class="page__hero hero">

        <div class="container">
          <picture class="hero__image-wrapper">
            <source media="(min-width: 1110px)" srcset="./images/hero-bg-desktop@1x.webp 1x, ./images/hero-bg-desktop@2x.webp 2x" type="image/webp" width="1150" height="746">
            <source media="(min-width: 1110px)" srcset="./images/hero-bg-desktop@1x.png 1x, ./images/hero-bg-desktop@2x.png 2x" type="image/png" width="1150" height="746">

            <source media="(min-width: 728px)" srcset="./images/hero-bg-tablet@1x.webp 1x, ./images/hero-bg-tablet@2x.webp 2x" type="image/webp" width="748" height="746">
            <source media="(min-width: 728px)" srcset="./images/hero-bg-tablet@1x.png 1x, ./images/hero-bg-tablet@2x.png 2x" type="image/png" width="748" height="746">

            <source srcset="./images/hero-bg-mobile@1x.webp 1x, ./images/hero-bg-mobile@2x.webp 2x" type="image/webp">
            <img class="hero__image" src="./images/hero-bg@1x.png" width="320" height="373" srcset="./images/hero-bg@2x.png 2x" alt="#">
          </picture>

          <div class="hero__content-wrapper">
            <h1 class="hero__title">Милые штуки<br> ручной<br> работы для дома</h1>

            <ul class="hero__nav">
              <li class="hero__nav-item">
                <a class="hero__nav-link hero__nav-link--interior" href="#">Предметы <br> интерьера</a>
              </li>
              <li class="hero__nav-item">
                <a class="hero__nav-link hero__nav-link--toy" href="#">Детские <br> игрушки</a>
              </li>
            </ul>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="page__footer page-footer">
    <div class="page-footer__content-wrapper container">
      <a class="page-footer__logo logo-secondary" href="#" aria-label="Главная страница | Mishka">
        <svg width="102" height="34">
          <use href="./icons/stack.svg#logo-footer"></use>
        </svg>
      </a>

      <ul class="page-footer__social social">
        <li class="social__item"><a class="social__link" href="#">
            <span class="visually-hidden">Instagram</span>
            <svg width="22" height="21">
              <use href="./icons/stack.svg#icon-inst"></use>
            </svg>
          </a></li>
        <li class="social__item"><a class="social__link" href="#">
            <span class="visually-hidden">Facebook</span>
            <svg width="15" height="22">
              <use href="./icons/stack.svg#icon-fb"></use>
            </svg>
          </a></li>
        <li class="social__item"><a class="social__link" href="#">
            <span class="visually-hidden">Twitter</span>
            <svg width="23" height="20">
              <use href="./icons/stack.svg#icon-tw"></use>
            </svg>
          </a></li>
      </ul>

      <span class="page-footer__split-line"></span>

      <a class="page-footer__copyright copyright" href="https://htmlacademy.ru/intensive/adaptive" aria-label="Онлайн‑курс HTML и CSS. Адаптивная вёрстка и автоматизация">
        <span class="copyright__text">Разработано</span>
        <svg width="27" height="34">
          <use href="./icons/stack.svg#logo-htmlacademy"></use>
        </svg>
      </a>
    </div>
  </footer>
</body>

</html>
